name: 安装依赖打包

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 下载 Python wheel
        run: |
          mkdir -p wheels
          pip download \
            grpcio \
            grpcio-tools \
            protobuf \
            pyyaml \
            psutil \
            aiohttp \
            --only-binary=:all: \
            --platform=manylinux_2_17_x86_64 \
            --python-version=313 \
            --implementation=cp \
            --abi=cp313 \
            -d ./wheels/

          echo "=== 下载的 wheel ==="
          ls -lh ./wheels/

      - name: 下载 main.so
        run: |
          # 获取最新 tag
          RELEASE=$(curl -s https://api.github.com/repos/oyz8/agent-v1-so/releases/latest)
          TAG=$(echo "$RELEASE" | grep '"tag_name"' | head -1 | cut -d'"' -f4)
          echo "Tag: $TAG"

          # 从 assets 里找 main-3.13-amd64.so 的下载链接
          URL=$(echo "$RELEASE" | grep browser_download_url | grep 'main-3.13-amd64.so' | cut -d'"' -f4)
          echo "URL: $URL"

          if [ -z "$URL" ]; then
            echo "❌ 未找到 main-3.13-amd64.so，使用固定链接兜底"
            URL="https://github.com/oyz8/agent-v1-so/releases/download/main.so-v28/main-3.13-amd64.so"
          fi

          curl -fSL "$URL" -o main.so
          ls -lh main.so

      - name: 打包
        run: |
          zip -r deploy.zip wheels/ main.so
          echo "=== zip 内容 ==="
          unzip -l deploy.zip
          ls -lh deploy.zip

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-package
          path: deploy.zip
          retention-days: 7
