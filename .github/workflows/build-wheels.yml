# .github/workflows/build-wheels.yml
name: 安装依赖打包

on:
  workflow_dispatch:
    inputs:
      grpcio_version:
        description: 'grpcio 版本 (留空=最新)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 下载 Python wheel
        run: |
          pip download \
            grpcio \
            grpcio-tools \
            protobuf \
            pyyaml \
            psutil \
            aiohttp \
            --only-binary=:all: \
            --platform=manylinux_2_17_x86_64 \
            --python-version=313 \
            --implementation=cp \
            --abi=cp313 \
            -d ./wheels/

          echo "=== 下载的文件 ==="
          ls -lh ./wheels/

      - name: 获取 main.so 最新 Tag
        run: |
          TAG=$(curl -s https://api.github.com/repos/oyz8/agent-v1-so/releases/latest \
                | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "最新 Tag: $TAG"

      - name: 下载 main.so
        run: |
          URL="https://github.com/oyz8/agent-v1-so/releases/download/${{ env.TAG }}/main-3.13-amd64.so"
          echo "下载: $URL"
          curl -fSL "$URL" -o ./main.so
          ls -lh ./main.so

      - name: 打包 zip
        run: |
          zip -r deploy.zip wheels/ main.so
          ls -lh deploy.zip
          echo "=== zip 内容 ==="
          unzip -l deploy.zip

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-package
          path: deploy.zip
          retention-days: 7
