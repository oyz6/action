name: 测试 WARP 换 IP 及恩山访问

on:
  workflow_dispatch:

jobs:
  test-promo:
    name: 测试 WARP 换 IP 及恩山访问
    runs-on: ubuntu-latest

    steps:
      - name: 启用 WARP 代理 (客户端模式)
        uses: fscarmen/warp-on-actions@v1.4
        with:
          stack: ipv4
          mode: client

      - name: 修复 DNS
        run: |
          sudo systemctl stop systemd-resolved 2>/dev/null || true
          sudo rm -f /etc/resolv.conf
          echo -e "nameserver 1.1.1.1\nnameserver 8.8.8.8" | sudo tee /etc/resolv.conf
          sudo chattr +i /etc/resolv.conf 2>/dev/null || true
          sleep 2

      - name: 访问恩山推广链接
        id: promo
        continue-on-error: true
        run: |
          URL="https://www.right.com.cn/forum/?fromuid=919756"

          echo "===== WARP 出口 IP ====="
          curl -s --max-time 15 https://www.cloudflare.com/cdn-cgi/trace | grep -E "^(ip|warp|loc)=" || true
          echo ""

          echo "===== 访问: $URL ====="
          SUCCESS=0
          for i in 1 2 3; do
            echo "----- 第 $i 次尝试 -----"
            HTTP_CODE=$(curl -s -o /tmp/promo_body.html -D /tmp/promo_headers.txt \
              -w "%{http_code}" --max-time 30 \
              -H "User-Agent: Mozilla/5.0 (Linux; Android 13; SM-G981B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0.0.0 Mobile Safari/537.36" \
              -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8" \
              -H "Accept-Language: zh-CN,zh;q=0.9" \
              -H "Cache-Control: no-cache" \
              -H "Pragma: no-cache" \
              -H "Upgrade-Insecure-Requests: 1" \
              --compressed "$URL" || echo "000")

            echo "HTTP: $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ] && grep -qi "rHEX_2132_promotion" /tmp/promo_headers.txt; then
              echo "✅ 第 $i 次成功：拿到 rHEX_2132_promotion"
              grep -i "rHEX_2132_promotion" /tmp/promo_headers.txt
              SUCCESS=1
              break
            fi

            echo "❌ 第 $i 次失败"
            if [ -f /tmp/promo_headers.txt ]; then
              cat /tmp/promo_headers.txt
            fi
            sleep 10
          done

          if [ "$SUCCESS" = "1" ]; then
            echo "PROMO_OK=1" >> "$GITHUB_ENV"
          else
            echo "PROMO_OK=0" >> "$GITHUB_ENV"
          fi

      - name: 推送推广 TG 通知
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ "$PROMO_OK" = "1" ]; then
            ICON="✅"
            TEXT="成功"
          else
            ICON="❌"
            TEXT="失败"
          fi
          TIME_CN=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="${ICON} <b>恩山访问推广</b>%0A%0A结果：${TEXT}%0A时间：${TIME_CN}%0A%0AEnshan Daily Sign-in" \
            --max-time 10 || true
