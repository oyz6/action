name: X10hosting 保活 2

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 6 * * *'   # 每天 UTC 6:00

permissions:
  actions: write
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: 检出私有仓库
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/scripts
          token: ${{ secrets.REPO_TOKEN }}

      - name: 配置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装系统依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb fonts-noto-cjk fonts-wqy-zenhei p7zip-full

      - name: 安装 Python 库
        run: |
          pip install -q seleniumbase requests

      - name: 安装 ChromeDriver
        run: seleniumbase install chromedriver

      - name: 下载并解压 NopeCHA 扩展
        run: |
          mkdir -p scripts/extensions/nopecha
          wget -q -O /tmp/nopecha.zip \
            https://github.com/NopeCHALLC/nopecha-extension/releases/download/0.6.1/chromium.zip
          7z x -y /tmp/nopecha.zip -o/tmp/nopecha_extracted
          # 确保 manifest.json 位于 unpacked 根目录
          if [ -f /tmp/nopecha_extracted/manifest.json ]; then
            mv /tmp/nopecha_extracted scripts/extensions/nopecha/unpacked
          else
            # 通常解压后有一个子目录，移动其内容
            mv /tmp/nopecha_extracted/* scripts/extensions/nopecha/unpacked
          fi
          echo "NOPECHA_PATH=$(pwd)/scripts/extensions/nopecha/unpacked" >> $GITHUB_ENV

      - name: 设置代理
        env:
          NODE_LINK: ${{ secrets.PROXY_NODE }}  # 改为对应节点变量名 （大金）双ISP - US
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          chmod +x scripts/setup_proxy.sh
          if ! bash scripts/setup_proxy.sh; then
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT_ID}" \
              -d parse_mode="HTML" \
              -d text="❌ <b>VPS8 签到失败</b>%0A%0A原因: 代理不可用%0A仓库: ${{ github.repository }}%0A查看: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --max-time 10 || true
            exit 1
          fi

      - name: 执行保活脚本
        env:
          X10HOSTING: ${{ secrets.X10HOSTING }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}   # 由 setup_proxy.sh 导出
          NOPECHA_PATH: ${{ env.NOPECHA_PATH }}
          NOPECHA_KEY: ${{ secrets.NOPECHA_KEY }}
        run: |
          mkdir -p screenshots
          xvfb-run -a --server-args="-screen 0 1280x720x24" python -u scripts/x10hosting/x10hosting_keepalive.py

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x10-screenshots-${{ github.run_number }}
          path: screenshots/*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: 清理历史运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 2
