name: X10hosting 保活 2

on:
  workflow_dispatch:
#  schedule:
#    - cron: '0 6 * * *'   # 每天 UTC 6:00 自动运行一次

permissions:
  actions: write
  contents: read

jobs:
  keepalive:
    name: 执行保活脚本
    runs-on: ubuntu-latest

    steps:
      - name: 检出私有仓库
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/scripts
          token: ${{ secrets.REPO_TOKEN }}

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb unzip curl

      - name: 安装 Python 依赖
        run: |
          pip install --upgrade pip
          pip install playwright requests
          playwright install chromium
          playwright install-deps chromium

      - name: 下载 Buster 扩展
        run: |
          wget -q https://github.com/dessant/buster/releases/download/v3.4.0/buster_captcha_solver_for_humans-3.4.0-chrome.zip -O /tmp/buster.zip
          mkdir -p /tmp/buster_extract
          unzip -q /tmp/buster.zip -d /tmp/buster_extract
          BUSTER_DIR=$(find /tmp/buster_extract -name manifest.json -exec dirname {} \; | head -1)
          echo "BUSTER_PATH=$BUSTER_DIR" >> $GITHUB_ENV

      - name: 设置代理
        env:
          NODE_LINK: ${{ secrets.PROXY_NODE_ISP }}  # 改为对应节点变量名 美国 加利福尼亚州 洛杉矶 - ISP
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          chmod +x scripts/setup_proxy.sh
          if ! bash scripts/setup_proxy.sh; then
            echo "❌ 代理设置失败，发送通知..."
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT_ID}" \
              -d parse_mode="HTML" \
              -d text="❌ <b>VPS8 签到失败</b>%0A%0A原因: 代理不可用%0A仓库: ${{ github.repository }}%0A查看: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --max-time 10 || true
            exit 1
          fi

      - name: 执行保活脚本
        env:
          X10HOSTING: ${{ secrets.X10HOSTING }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PROXY_HTTP: ${{ env.PROXY_HTTP }}          # 由 setup_proxy.sh 设置
          BUSTER_PATH: ${{ env.BUSTER_PATH }}
        run: |
          mkdir -p output/screenshots
          xvfb-run -a --server-args="-screen 0 1280x720x24" python scripts/x10hosting/x10hosting_keepalive.py

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x10-screenshots-${{ github.run_number }}
          path: output/screenshots/*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: 清理历史运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 2
