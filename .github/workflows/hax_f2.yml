name: Hax F2 自动续期

on:
  schedule:
    - cron: '0 18 * * *'   # 脚本根据到期时间自动更新
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  NODE_LINK:          ${{ secrets.F2_NODE_LINK || secrets.NODE_LINK }}
  TELEGRAM_PHONE:     ${{ secrets.F2_TELEGRAM_PHONE }}
  TG_STRING_SESSION:  ${{ secrets.F2_TG_STRING_SESSION }}
  TG_BOT_TOKEN:       ${{ secrets.TG_BOT_TOKEN }}
  TG_CHAT_ID:         ${{ secrets.TG_CHAT_ID }}
  TELEGRAM_API_ID:    ${{ secrets.TELEGRAM_API_ID || '2040' }}
  TELEGRAM_API_HASH:  ${{ secrets.TELEGRAM_API_HASH || 'b18441a1ff607e10a989891a5462e627' }}
  NOPECHA_KEY:        ${{ secrets.NOPECHA_KEY }}

jobs:
  renew-f2:
    name: F2 续期
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: 检出私有脚本仓库
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: .

      - name: 检出主仓库（用于更新 cron）
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_TOKEN }}
          path: main-repo
          persist-credentials: true

      - name: 检查账号配置
        id: check_acc
        run: |
          if [ -z "${{ env.TELEGRAM_PHONE }}" ] || [ -z "${{ env.TG_STRING_SESSION }}" ]; then
            echo "has_acc=false" >> $GITHUB_OUTPUT
            echo "⚠️ [跳过] F3 账号未配置 (F3_TELEGRAM_PHONE 或 F3_TG_STRING_SESSION 缺失)"
          else
            echo "has_acc=true" >> $GITHUB_OUTPUT
          fi

      - name: 配置 Python 3.11
        if: steps.check_acc.outputs.has_acc == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/Hax/requirements.txt'

      - name: 安装基础系统与 Python 依赖
        if: steps.check_acc.outputs.has_acc == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pip install --upgrade pip
          pip install -r scripts/Hax/requirements.txt

      - name: 安装 SeleniumBase 浏览器与驱动
        if: steps.check_acc.outputs.has_acc == 'true'
        run: |
          seleniumbase install chromedriver
          seleniumbase install chrome

      - name: 解压 NopeCHA 扩展
        if: steps.check_acc.outputs.has_acc == 'true'
        run: |
          EXT_DIR="scripts/extensions/nopecha"
          ZIP_FILE="$EXT_DIR/nopecha.zip"
          UNPACKED_DIR="$EXT_DIR/unpacked"
          if [ -f "$ZIP_FILE" ]; then
            mkdir -p "$UNPACKED_DIR"
            unzip -q -o "$ZIP_FILE" -d "$UNPACKED_DIR"
            echo "✅ NopeCHA 扩展解压成功"
          fi

      - name: 设置代理
        if: steps.check_acc.outputs.has_acc == 'true'
        env:
          NODE_LINK: ${{ env.NODE_LINK }}
          TG_BOT_TOKEN: ${{ env.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ env.TG_CHAT_ID }}
        run: |
          chmod +x scripts/setup_proxy.sh
          if ! bash scripts/setup_proxy.sh; then
            echo "❌ 代理设置失败，发送通知..."
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT_ID}" \
              -d parse_mode="HTML" \
              -d text="❌ <b>F2 Hax 续期失败</b>%0A%0A原因: 代理不可用%0A仓库: ${{ github.repository }}%0A查看: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --max-time 10 || true
            exit 1
          fi
          if [ -f proxy.env ]; then
            cat proxy.env >> $GITHUB_ENV
          fi

      - name: 执行续期
        if: steps.check_acc.outputs.has_acc == 'true'
        id: renew
        env:
          ACCOUNT_NAME: "F2"
          ACCOUNT_INDEX: "2"
          NODE_LINK: ${{ env.NODE_LINK }}
          TELEGRAM_PHONE: ${{ env.TELEGRAM_PHONE }}
          TG_STRING_SESSION: ${{ env.TG_STRING_SESSION }}
          TELEGRAM_API_ID: ${{ env.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ env.TELEGRAM_API_HASH }}
          TG_BOT_TOKEN: ${{ env.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ env.TG_CHAT_ID }}
          NOPECHA_KEY: ${{ env.NOPECHA_KEY }}
          IS_PROXY: ${{ env.IS_PROXY }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
        run: |
          set -o pipefail
          xvfb-run -a --server-args="-screen 0 1280x720x24" python -u scripts/Hax/hax_renw.py 2>&1 | tee output.log
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: 上传截图 (成功或失败均保留)
        if: always() && steps.check_acc.outputs.has_acc == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hax-screenshots-f2
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: 更新 Cron
        if: always() && steps.check_acc.outputs.has_acc == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_TOKEN }}
          WORKFLOW_FILE: ".github/workflows/hax_f2.yml"
          ACCOUNT_TAG: "F2"
        run: |
          if [ ! -f output.log ]; then
            echo "未找到 output.log，跳过 cron 更新"
            exit 0
          fi
          NEXT_RUN_UTC=$(grep -oP 'NEXT_RUN_UTC=\K.*' output.log | tail -1)
          if [ -n "$NEXT_RUN_UTC" ]; then
            echo "下次运行时间 (UTC): $NEXT_RUN_UTC"
            CRON=$(date -u -d "$NEXT_RUN_UTC" +"%-M %-H %-d %-m *")
            echo "新 cron: $CRON"

            cd main-repo
            if [ ! -f "$WORKFLOW_FILE" ]; then
              echo "❌ 未找到工作流文件 $WORKFLOW_FILE，跳过 cron 更新"
              exit 0
            fi

            sed -i "0,/cron: '.*'/s//cron: '$CRON'/" "$WORKFLOW_FILE"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$WORKFLOW_FILE"
            COMMIT_MSG="[$ACCOUNT_TAG] 下次执行时间：$(date -u -d "$NEXT_RUN_UTC" '+%Y年%m月%d日 %H:%M UTC')"
            git commit -m "$COMMIT_MSG" || echo "没有变更"
            git pull --rebase origin main
            git push origin main
          else
            echo "未检测到 NEXT_RUN_UTC，跳过 cron 更新"
          fi

      - name: 清理旧的工作流运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 2
