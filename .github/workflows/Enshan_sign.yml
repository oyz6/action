name: 恩山论坛每日签到

on:
  schedule:
    # 每天北京时间 12:05 运行，对应 UTC 04:05
    - cron: '05 4 * * *'
  workflow_dispatch:
    inputs:
      enable_f1:
        description: '启用签到'
        required: false
        default: true
        type: boolean
      enable_f2:
        description: '启用访问推广'
        required: false
        default: true
        type: boolean

env:
  PYTHON_VERSION: '3.11'
  CHROME_VERSION: '131'

jobs:
  # ============================================================
  # Job 1：签到（走 sing-box 代理）
  # ============================================================
  checkin:
    name: 签到
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name == 'schedule' || inputs.enable_f1 }}

    steps:
      - name: 拉取私有仓库
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: .

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装 Chrome 浏览器
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: ${{ env.CHROME_VERSION }}
          install-chromedriver: false

      - name: 安装中文字体
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-wqy-zenhei
          fc-cache -fv

      - name: 安装 Xvfb（虚拟显示）
        run: |
          sudo apt-get install -y xvfb

      - name: 启动 Xvfb
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp &
          sleep 2
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "启动 Xvfb 完成"

      - name: 安装 Python 依赖
        run: |
          pip install --upgrade pip
          pip install requests "requests[socks]" selenium undetected-chromedriver
          if [ -f enshan/requirements.txt ]; then
            pip install -r enshan/requirements.txt
          fi

      - name: 创建截图目录
        run: mkdir -p /tmp/screenshots

      - name: 清理 undetected-chromedriver 缓存
        run: |
          rm -rf "$HOME/.local/share/undetected_chromedriver" || true

      - name: 设置代理
        timeout-minutes: 5
        env:
#          NODE_LINK: ${{ secrets.PROXY_NODE_360t7 }}    # 360t7 美国一年 - 双ISP - US
          NODE_LINK: ${{ secrets.PROXY_NODE }}          # 大金 双ISP - US
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          chmod +x scripts/setup_proxy.sh
          if ! bash scripts/setup_proxy.sh; then
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT_ID}" \
              -d parse_mode="HTML" \
              -d text="❌ <b>恩山签到失败</b>%0A%0A原因: 代理不可用%0A仓库: ${{ github.repository }}%0A查看: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --max-time 10 || true
            exit 1
          fi

      - name: 执行签到脚本
        timeout-minutes: 10
        env:
          RIGHT: ${{ secrets.RIGHT }}
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROME_VERSION: ${{ env.CHROME_VERSION }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DISPLAY: ':99'
        run: |
          python enshan/main.py

#      - name: 上传截图
#        if: always()
#        uses: actions/upload-artifact@v4
#        with:
#          name: enshan-screenshots
#          path: /tmp/screenshots/
#          retention-days: 3
#          if-no-files-found: ignore

      - name: 清理代理与临时文件
        if: always()
        run: |
          pkill -f sing-box 2>/dev/null || true
          rm -f sing-box sing-box-config.json sing-box.log 2>/dev/null || true

  # ============================================================
  # Job 2：访问推广 (恩山)
  # ============================================================
  promo_enshan:
    name: 访问推广 (恩山)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || inputs.enable_f2 }}

    steps:
      - name: 访问恩山推广链接
        id: promo
        continue-on-error: true
        timeout-minutes: 10
        env:
          PROXY_POOL_URL: ${{ secrets.PROXY_POOL_URL }}  # 从 Secrets 获取代理池链接
        run: |
          URL="https://www.right.com.cn/forum/?fromuid=919756"
          COOKIE_PATTERN="rHEX_2132_promotion"
          SUCCESS=0
          START=$(date +%s)
          MAX_TOTAL=480

          echo "===== 下载代理池 ====="
          if [ -z "$PROXY_POOL_URL" ]; then
            echo "❌ 未配置 PROXY_POOL_URL 变量"
            echo "PROMO_OK=0" >> "$GITHUB_ENV"
            exit 0
          fi
          
          curl -sL --max-time 20 "$PROXY_POOL_URL" -o /tmp/alive.txt || true
          mapfile -t PROXIES < <(tr ' ' '\n' < /tmp/alive.txt | grep -E '^(http|socks5)://' | grep -v '^$')
          TOTAL_PROXIES=${#PROXIES[@]}
          
          echo "成功加载 $TOTAL_PROXIES 个代理"
          if [ "$TOTAL_PROXIES" -eq 0 ]; then
            echo "❌ 代理池为空，直接退出"
            echo "PROMO_OK=0" >> "$GITHUB_ENV"
            exit 0
          fi

          for ((i=0; i<TOTAL_PROXIES && i<20; i++)); do
            NOW=$(date +%s)
            if [ $((NOW - START)) -gt $MAX_TOTAL ]; then
              echo "⏱ 已耗时 $((NOW - START))s，超过 ${MAX_TOTAL}s，停止重试"
              break
            fi

            PROXY="${PROXIES[$i]}"
            MASKED_PROXY=$(echo "$PROXY" | sed -E 's/([0-9]+)\.([0-9]+)\.([0-9]+)\.([0-9]+)/\1.*.*.\4/g')

            echo "===== 第 $((i+1)) 次尝试（已耗时 $((NOW - START))s）====="
            echo "当前代理: $MASKED_PROXY"

            HTTP_CODE=$(curl -s -o /tmp/promo_body.html -D /tmp/promo_headers.txt \
              -w "%{http_code}" --connect-timeout 8 --max-time 20 \
              -x "$PROXY" \
              -H "User-Agent: Mozilla/5.0 (Linux; Android 13; SM-G981B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0.0.0 Mobile Safari/537.36" \
              -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8" \
              -H "Accept-Language: zh-CN,zh;q=0.9" \
              -H "Cache-Control: no-cache" \
              -H "Pragma: no-cache" \
              -H "Upgrade-Insecure-Requests: 1" \
              --compressed "$URL") || HTTP_CODE="000"

            echo "HTTP: $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ] && grep -qi "$COOKIE_PATTERN" /tmp/promo_headers.txt; then
              echo "✅ 第 $((i+1)) 次成功：拿到 $COOKIE_PATTERN"
              grep -i "$COOKIE_PATTERN" /tmp/promo_headers.txt
              SUCCESS=1
              break
            fi

            echo "❌ 第 $((i+1)) 次失败"
            [ -f /tmp/promo_headers.txt ] && cat /tmp/promo_headers.txt

            case "$HTTP_CODE" in
              520|521|522|523|524|525) echo "→ 5xx 源站错误，等 10s"; sleep 10 ;;
              403|429|200) echo "→ WAF/限流拦截，等 3s"; sleep 3 ;;
              *) echo "→ 连接失败或超时，等 3s"; sleep 3 ;;
            esac
          done

          if [ "$SUCCESS" = "1" ]; then
            echo "PROMO_OK=1" >> "$GITHUB_ENV"
          else
            echo "PROMO_OK=0" >> "$GITHUB_ENV"
          fi

      - name: 推送推广 TG 通知
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ "$PROMO_OK" = "1" ]; then ICON="✅"; TEXT="成功"; else ICON="❌"; TEXT="失败或超时"; fi
          TIME_CN=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="${ICON} <b>恩山访问推广</b>%0A%0A结果：${TEXT}%0A时间：${TIME_CN}" \
            --max-time 10 || true

  # ============================================================
  # Job 3：访问推广 (吾爱破解 - 终极 TLS 指纹伪装版)
  # ============================================================
  promo_52pojie:
    name: 访问推广 (吾爱破解)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || inputs.enable_f2 }}

    steps:
      - name: 安装 Cloudflare WARP
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update && sudo apt-get install -y cloudflare-warp
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          sleep 5
          warp-cli --accept-tos status

      - name: 下载并配置 curl-impersonate
        run: |
          # 下载支持模拟 Chrome 116 的 curl 版本
          wget -q https://github.com/lwthiker/curl-impersonate/releases/download/v0.6.1/curl-impersonate-v0.6.1.x86_64-linux-gnu.tar.gz
          tar -zxf curl-impersonate-v0.6.1.x86_64-linux-gnu.tar.gz
          # 将 curl_chrome116 移动到 /usr/local/bin 并赋予执行权限
          sudo cp curl_chrome116 /usr/local/bin/curl_chrome116
          sudo chmod +x /usr/local/bin/curl_chrome116
          echo "curl-impersonate 安装完成"

      - name: 访问吾爱破解推广链接
        id: promo
        continue-on-error: true
        timeout-minutes: 5
        run: |
          URL="https://www.52pojie.cn/?fromuid=2548567"
          COOKIE_PATTERN="htVC_2132_promotion"
          SUCCESS=0
          
          echo "===== 通过 WARP + curl-impersonate 发起请求 ====="
          
          # 使用 curl_chrome116，它会自动带齐所有 Chrome 的底层指纹
          # 注意：因为 curl-impersonate 本身已经包含了全套头，我们不再手动添加 Headers
          HTTP_CODE=$(curl_chrome116 -s -o /tmp/promo_body.html -D /tmp/promo_headers.txt \
            -w "%{http_code}" --connect-timeout 10 --max-time 20 \
            -x "socks5://127.0.0.1:40000" \
            "$URL") || HTTP_CODE="000"

          echo "HTTP: $HTTP_CODE"

          if [ "$HTTP_CODE" = "200" ] && grep -qi "$COOKIE_PATTERN" /tmp/promo_headers.txt; then
            echo "✅ 成功：拿到 $COOKIE_PATTERN"
            grep -i "$COOKIE_PATTERN" /tmp/promo_headers.txt
            SUCCESS=1
          else
            echo "❌ 失败"
            cat /tmp/promo_headers.txt
          fi

          if [ "$SUCCESS" = "1" ]; then
            echo "PROMO_OK=1" >> "$GITHUB_ENV"
          else
            echo "PROMO_OK=0" >> "$GITHUB_ENV"
          fi

      - name: 关闭 WARP
        if: always()
        run: |
          warp-cli --accept-tos disconnect || true
          warp-cli --accept-tos registration delete || true

      - name: 推送推广 TG 通知
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ "$PROMO_OK" = "1" ]; then ICON="✅"; TEXT="成功"; else ICON="❌"; TEXT="失败"; fi
          TIME_CN=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="${ICON} <b>吾爱破解访问推广</b>%0A%0A结果：${TEXT}%0A时间：${TIME_CN}" \
            --max-time 10 || true
            
  # ============================================================
  # Job 4：清理工作流记录
  # ============================================================
  cleanup:
    name: 清理工作流记录
    runs-on: ubuntu-latest
    # 等待签到和两个推广任务全部结束（无论成功失败）
    needs: [checkin, promo_enshan, promo_52pojie]
    if: always()

    steps:
      - name: 清理工作流记录（保留最近1次）
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 1
