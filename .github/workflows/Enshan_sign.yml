name: 恩山论坛每日签到

on:
  schedule:
    # 每天北京时间 12:05 运行，对应 UTC 04:05
    - cron: '05 4 * * *'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  CHROME_VERSION: '131'

jobs:
  # ============================================================
  # Job 1：签到 + 发帖（走 sing-box 代理）
  # ============================================================
  checkin:
    name: 签到 + 发帖
    runs-on: ubuntu-latest

    steps:
      - name: 拉取私有仓库
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: .

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装 Chrome 浏览器
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: ${{ env.CHROME_VERSION }}
          install-chromedriver: false

      - name: 安装中文字体
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-wqy-zenhei
          fc-cache -fv

      - name: 安装 Xvfb（虚拟显示）
        run: |
          sudo apt-get install -y xvfb

      - name: 启动 Xvfb
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp &
          sleep 2
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "启动 Xvfb 完成"

      - name: 安装 Python 依赖
        run: |
          pip install --upgrade pip
          pip install requests "requests[socks]" selenium undetected-chromedriver
          if [ -f enshan/requirements.txt ]; then
            pip install -r enshan/requirements.txt
          fi

      - name: 创建截图目录
        run: mkdir -p /tmp/screenshots

      - name: 清理 undetected-chromedriver 缓存
        run: |
          rm -rf "$HOME/.local/share/undetected_chromedriver" || true

      - name: 设置代理
        env:
          NODE_LINK: ${{ secrets.PROXY_NODE_360t7 }}  # 360t7 美国一年 - 双ISP - US
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          chmod +x scripts/setup_proxy.sh
          if ! bash scripts/setup_proxy.sh; then
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT_ID}" \
              -d parse_mode="HTML" \
              -d text="❌ <b>恩山签到失败</b>%0A%0A原因: 代理不可用%0A仓库: ${{ github.repository }}%0A查看: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --max-time 10 || true
            exit 1
          fi

      - name: 执行签到脚本
        env:
          RIGHT: ${{ secrets.RIGHT }}
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROME_VERSION: ${{ env.CHROME_VERSION }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DISPLAY: ':99'
        run: |
          python enshan/main.py

#      - name: 上传截图
#        if: always()
#        uses: actions/upload-artifact@v4
#        with:
#          name: enshan-screenshots
#          path: /tmp/screenshots/
#          retention-days: 3
#          if-no-files-found: ignore

      - name: 清理代理与临时文件
        if: always()
        run: |
          pkill -f sing-box 2>/dev/null || true
          rm -f sing-box sing-box-config.json sing-box.log 2>/dev/null || true

  # ============================================================
  # Job 2：WARP 访问推广（独立 runner，走 WARP）
  # ============================================================
  promo:
    name: 访问推广
    runs-on: ubuntu-latest

    steps:
      - name: 启用 WARP 代理
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: dual
          mode: client

      - name: 修复 DNS
        run: |
          sudo systemctl stop systemd-resolved 2>/dev/null || true
          sudo rm -f /etc/resolv.conf
          echo -e "nameserver 1.1.1.1\nnameserver 8.8.8.8" | sudo tee /etc/resolv.conf
          sudo chattr +i /etc/resolv.conf 2>/dev/null || true
          sleep 2

      - name: 访问恩山推广链接
        id: promo
        continue-on-error: true
        run: |
          URL="https://www.right.com.cn/forum/?fromuid=919756"

          echo "===== WARP 出口 IP ====="
          curl -s --max-time 15 https://www.cloudflare.com/cdn-cgi/trace | grep -E "^(ip|warp|loc)=" || true
          echo ""

          echo "===== 访问: $URL ====="
          SUCCESS=0
          for i in 1 2 3; do
            echo "----- 第 $i 次尝试 -----"
            HTTP_CODE=$(curl -s -o /tmp/promo_body.html -D /tmp/promo_headers.txt \
              -w "%{http_code}" --max-time 30 \
              -H "User-Agent: Mozilla/5.0 (Linux; Android 13; SM-G981B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0.0.0 Mobile Safari/537.36" \
              -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8" \
              -H "Accept-Language: zh-CN,zh;q=0.9" \
              -H "Cache-Control: no-cache" \
              -H "Pragma: no-cache" \
              -H "Upgrade-Insecure-Requests: 1" \
              --compressed "$URL" || echo "000")

            echo "HTTP: $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ] && grep -qi "rHEX_2132_promotion" /tmp/promo_headers.txt; then
              echo "✅ 第 $i 次成功：拿到 rHEX_2132_promotion"
              grep -i "rHEX_2132_promotion" /tmp/promo_headers.txt
              SUCCESS=1
              break
            fi

            echo "❌ 第 $i 次失败"
            if [ -f /tmp/promo_headers.txt ]; then
              cat /tmp/promo_headers.txt
            fi
            sleep 10
          done

          if [ "$SUCCESS" = "1" ]; then
            echo "PROMO_OK=1" >> "$GITHUB_ENV"
          else
            echo "PROMO_OK=0" >> "$GITHUB_ENV"
          fi

      - name: 推送推广 TG 通知
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ "$PROMO_OK" = "1" ]; then
            ICON="✅"
            TEXT="成功"
          else
            ICON="❌"
            TEXT="失败"
          fi
          TIME_CN=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="${ICON} <b>恩山访问推广</b>%0A%0A结果：${TEXT}%0A时间：${TIME_CN}%0A%0AEnshan Daily Sign-in" \
            --max-time 10 || true

  # ============================================================
  # Job 3：清理工作流记录（等前两个 job 都结束后再跑）
  # ============================================================
  cleanup:
    name: 清理工作流记录
    runs-on: ubuntu-latest
    needs: [checkin, promo]
    if: always()

    steps:
      - name: 清理工作流记录（保留最近3次）
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 1
