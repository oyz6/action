name: Enshan 访问推广

on:
  workflow_dispatch:
  schedule:
    # 每天北京时间 10:00（UTC 02:00）
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  promo:
    name: 访问推广链接
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: 启用 WARP 代理
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: dual
          mode: client

      - name: 修复 DNS
        run: |
          sudo systemctl stop systemd-resolved 2>/dev/null || true
          sudo rm -f /etc/resolv.conf
          echo -e "nameserver 1.1.1.1\nnameserver 8.8.8.8" | sudo tee /etc/resolv.conf
          sudo chattr +i /etc/resolv.conf 2>/dev/null || true
          sleep 2

      - name: 验证 WARP 出口 IP
        run: |
          echo "===== WARP 出口 IP ====="
          curl -s --max-time 15 https://www.cloudflare.com/cdn-cgi/trace | grep -E "^(ip|warp|loc)=" || true
          echo ""
          echo "===== 通用 IP 查询 ====="
          curl -s --max-time 15 https://api.ipify.org || true
          echo ""

      - name: 访问恩山推广链接
        run: |
          URL="https://www.right.com.cn/forum/?fromuid=919756"
          echo "访问: $URL"

          # 用 -D 输出响应头，方便检查有没有 rHEX_2132_promotion
          HTTP_CODE=$(curl -s -o /tmp/body.html -D /tmp/headers.txt \
            -w "%{http_code}" \
            --max-time 30 \
            -H "User-Agent: Mozilla/5.0 (Linux; Android 13; SM-G981B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0.0.0 Mobile Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8" \
            -H "Accept-Language: zh-CN,zh;q=0.9" \
            -H "Cache-Control: no-cache" \
            -H "Pragma: no-cache" \
            -H "Upgrade-Insecure-Requests: 1" \
            --compressed \
            "$URL" || echo "000")

          echo "HTTP 状态码: $HTTP_CODE"
          echo ""
          echo "===== 响应头 ====="
          cat /tmp/headers.txt
          echo ""
          echo "===== 是否拿到 promotion cookie ====="
          if grep -qi "rHEX_2132_promotion" /tmp/headers.txt; then
            echo "✅ 拿到 rHEX_2132_promotion！"
            grep -i "rHEX_2132_promotion" /tmp/headers.txt
          else
            echo "❌ 没有 rHEX_2132_promotion"
          fi
          echo ""
          echo "===== 响应体前 500 字节 ====="
          head -c 500 /tmp/body.html || true

      - name: 清理历史运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 3
