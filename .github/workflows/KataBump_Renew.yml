name: KataBump 续订

on:
  workflow_dispatch:
  schedule:
    - cron: '54 17 9 9 *'   # 脚本会根据续订开放时间自动更新此行

permissions:
  contents: write
  actions: write

jobs:
  renew:
    name: 执行脚本
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出私有仓库
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: .

      - name: 检出主仓库（用于更新 cron）
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_TOKEN }}
          path: main-repo
          persist-credentials: true

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libgtk-3-0 \
            libnss3 \
            libxss1 \
            libasound2t64 \
            libxtst6 \
            xauth \
            fonts-liberation \
            libgbm1 \
            libxkbcommon0 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libpango-1.0-0 \
            libcairo2

      - name: 安装 Python 依赖
        run: |
          pip install --upgrade pip
          pip install seleniumbase pyvirtualdisplay
          seleniumbase install chromedriver
          seleniumbase install chrome

      - name: 设置代理
        env:
          NODE_LINK: ${{ secrets.PROXY_NODE_360t7 }}  # 360t7 美国一年 - 双ISP - USPROXY_NODE_US_IT7
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          chmod +x scripts/setup_proxy.sh
          if ! bash scripts/setup_proxy.sh; then
            echo "❌ 代理设置失败，发送通知..."
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT_ID}" \
              -d parse_mode="HTML" \
              -d text="❌ <b>KataBump 续订失败</b>%0A%0A原因: 代理不可用%0A仓库: ${{ github.repository }}%0A查看: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --max-time 10 || true
            exit 1
          fi

      - name: 运行续订脚本
        id: renew
        env:
          KATABUMP: ${{ secrets.KATABUMP }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
          sleep 2
          python scripts/KataBump/main.py 2>&1 | tee output.log
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

#      - name: 上传截图
#        uses: actions/upload-artifact@v4
#        if: always()
#        with:
#          name: screenshots-${{ github.run_number }}
#          path: "*.png"
#          retention-days: 7
#          if-no-files-found: ignore

      - name: 更新 Cron
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_TOKEN }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          NEXT_RUN_UTC=$(grep -oP 'NEXT_RUN_UTC=\K.*' output.log | tail -1)
          if [ -n "$NEXT_RUN_UTC" ]; then
            echo "下次运行时间 (UTC): $NEXT_RUN_UTC"
            CRON=$(date -u -d "$NEXT_RUN_UTC" +"%-M %-H %-d %-m *")
            echo "新 cron: $CRON"
            cd main-repo

            WORKFLOW_FILE=$(grep -lE "^name:\s*['\"]?$WORKFLOW_NAME['\"]?\s*$" .github/workflows/*.yml .github/workflows/*.yaml 2>/dev/null | head -1)
            if [ -z "$WORKFLOW_FILE" ]; then
              echo "❌ 未找到匹配的工作流文件，跳过 cron 更新"
              exit 1
            fi

            echo "找到工作流文件: $WORKFLOW_FILE"
            sed -i "0,/cron: '.*'/s//cron: '$CRON'/" "$WORKFLOW_FILE"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$WORKFLOW_FILE"
            COMMIT_MSG="下次执行时间：$(date -u -d "$NEXT_RUN_UTC" '+%Y年%m月%d日 %H:%M')"
            git commit -m "$COMMIT_MSG" || echo "没有变更"
            git pull --rebase origin main
            git push
          else
            echo "未检测到 NEXT_RUN_UTC，跳过 cron 更新"
          fi

      - name: 清理旧的工作流运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 1
