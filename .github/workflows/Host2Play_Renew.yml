name: Host2Play 续期

on:
  schedule:
    - cron: '43 */6 * * *'    # 触发点UTC: 00:43、06:43、12:43、18:43
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  run-first:
    name: 首次执行
    runs-on: ubuntu-latest
    outputs:
      success: ${{ steps.renew_run.outcome == 'success' && 'true' || 'false' }}

    steps:
      - name: 拉取私有仓库
        uses: actions/checkout@v4
        with:
          repository: oyz6/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: .

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg unzip curl
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i /tmp/chrome.deb || sudo apt-get install -f -y

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install DrissionPage xvfbwrapper requests SpeechRecognition pydub

      - name: 启用 WARP 网络
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: dual
          mode: client

      - name: 修复 DNS
        run: |
          sudo systemctl stop systemd-resolved 2>/dev/null || true
          sudo systemctl disable systemd-resolved 2>/dev/null || true
          sudo rm -f /etc/resolv.conf
          echo -e "nameserver 1.1.1.1\nnameserver 8.8.8.8\nnameserver 1.0.0.1" | sudo tee /etc/resolv.conf
          sleep 2
          nslookup host2play.gratis 1.1.1.1 || echo "[WARN] 解析失败"
          curl -s --max-time 10 https://api.ipify.org && echo
          curl -s --max-time 10 https://www.cloudflare.com/cdn-cgi/trace | grep -E 'ip=|warp=|loc=' || true

      - name: 执行续订
        id: renew_run
        continue-on-error: true
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN_8 }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python -u scripts/Host2Play/main.py

      - name: 上传截图（首次）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-first-${{ github.run_number }}
          path: output/screenshots/*.png
          retention-days: 7
          if-no-files-found: ignore

  run-retry:
    name: 重试执行
    runs-on: ubuntu-latest
    needs: run-first
    if: always() && needs.run-first.outputs.success == 'false'
    permissions:
      actions: write
      contents: read

    steps:
      - name: 等待 60 秒（让 IP 封锁冷却）
        run: sleep 60

      - name: 拉取私有仓库
        uses: actions/checkout@v4
        with:
          repository: oyz6/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: .

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg unzip curl
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i /tmp/chrome.deb || sudo apt-get install -f -y

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install DrissionPage xvfbwrapper requests SpeechRecognition pydub

      - name: 启用 WARP 网络
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: dual
          mode: client

      - name: 修复 DNS
        run: |
          sudo systemctl stop systemd-resolved 2>/dev/null || true
          sudo systemctl disable systemd-resolved 2>/dev/null || true
          sudo rm -f /etc/resolv.conf
          echo -e "nameserver 1.1.1.1\nnameserver 8.8.8.8\nnameserver 1.0.0.1" | sudo tee /etc/resolv.conf
          sleep 2
          nslookup host2play.gratis 1.1.1.1 || echo "[WARN] 解析失败"
          curl -s --max-time 10 https://api.ipify.org && echo
          curl -s --max-time 10 https://www.cloudflare.com/cdn-cgi/trace | grep -E 'ip=|warp=|loc=' || true

      - name: 执行续订（重试）
        id: renew_retry
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN_8 }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python -u scripts/Host2Play/main.py

      - name: 上传截图（重试）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-retry-${{ github.run_number }}
          path: output/screenshots/*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: 清理历史运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 2
