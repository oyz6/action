  # ========================= 统一清理 =========================
  cleanup:
    name: 清理历史运行记录
    runs-on: ubuntu-22.04
    needs: [sign-f1, sign-f2, sign-f3]
    if: always()
    steps:
      - name: 清理历史运行记录
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 1
