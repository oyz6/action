name: Lunes Host 自动保活（并行）

on:
  schedule:
    # 每10天运行：1号、11号、21号 中午12:12 (北京时间)
    # UTC 时间 = 北京时间 - 8小时 = 04:12
    - cron: '12 4 1,11,21 * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

# =========================================================
#                账号配置区
# =========================================================
env:
  # ---------- 账号 1 ----------
  K1_NODE_LINK: ${{ secrets.PROXY_NODE_360t7 }}   # 360t7 美国一年 - 双ISP - US
  K1_LUNES:     ${{ secrets.LUNES_1 }}

  # ---------- 账号 2 ----------
  K2_NODE_LINK: ${{ secrets.PROXY_NODE }}         # 大金 双ISP - US
  K2_LUNES:     ${{ secrets.LUNES_2 }}

  # ---------- 公共配置 ----------
  TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
  TG_CHAT_ID:   ${{ secrets.TG_CHAT_ID }}
# =========================================================

# 同一 workflow 不并发，避免两次触发同时跑
concurrency:
  group: lunes-keepalive
  cancel-in-progress: false

jobs:
  # ========================= 账号 1 =========================
  keepalive-1:
    name: 账号 1
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # 不同 group，保证两个 job 可以并行
    concurrency:
      group: lunes-keepalive-1
      cancel-in-progress: false

    steps:
      - name: 导出账号配置
        run: |
          echo "NODE_LINK=${{ env.K1_NODE_LINK }}" >> $GITHUB_ENV
          echo "LUNES=${{ env.K1_LUNES }}" >> $GITHUB_ENV

      - name: 拉取私有仓库
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: .

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          # 版本约束加引号，避免 shell 把 > 当成重定向
          pip install "seleniumbase>=4.25.0" "pyvirtualdisplay>=3.0" "requests>=2.31.0"

      - name: 设置代理
        run: |
          chmod +x scripts/setup_proxy.sh
          if ! bash scripts/setup_proxy.sh; then
            echo "❌ 代理设置失败，发送通知..."
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT_ID}" \
              -d text="❌ Lunes Host 自动保活 1 失败：代理不可用" \
              --max-time 10 || true
            exit 1
          fi

      - name: 执行保活（第 1 次）
        id: attempt1
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ env.TG_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ env.TG_CHAT_ID }}
          # PROXY_SERVER 由 setup_proxy.sh 写入 $GITHUB_ENV，自动继承，无需在此声明
        run: python scripts/Lunes/Lunes-Keep.py

      - name: 备份第一次截图并等待
        if: steps.attempt1.outcome == 'failure'
        run: |
          if [ -d output/screenshots ]; then
            mkdir -p output/screenshots-attempt1
            find output/screenshots -maxdepth 1 -type f -name "*.png" -exec cp {} output/screenshots-attempt1/ \;
            rm -f output/screenshots/*.png
            echo "已备份第一次截图"
          fi
          echo "等待 60 秒后重试..."
          sleep 60

      - name: 执行保活（第 2 次）
        if: steps.attempt1.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ env.TG_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ env.TG_CHAT_ID }}
          # PROXY_SERVER 由 setup_proxy.sh 写入 $GITHUB_ENV，自动继承，无需在此声明
        run: python scripts/Lunes/Lunes-Keep.py

#      - name: 上传截图
#        uses: actions/upload-artifact@v4
#        if: always()
#        with:
#          name: screenshots-1-${{ github.run_number }}
#          path: |
#            output/screenshots-attempt1/
#            output/screenshots/
#          retention-days: 3
#          if-no-files-found: ignore

  # ========================= 账号 2 =========================
  keepalive-2:
    name: 账号 2
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: lunes-keepalive-2
      cancel-in-progress: false

    steps:
      - name: 导出账号配置
        run: |
          echo "NODE_LINK=${{ env.K2_NODE_LINK }}" >> $GITHUB_ENV
          echo "LUNES=${{ env.K2_LUNES }}" >> $GITHUB_ENV

      - name: 拉取私有仓库
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: .

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          pip install "seleniumbase>=4.25.0" "pyvirtualdisplay>=3.0" "requests>=2.31.0"

      - name: 设置代理
        run: |
          chmod +x scripts/setup_proxy.sh
          if ! bash scripts/setup_proxy.sh; then
            echo "❌ 代理设置失败，发送通知..."
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT_ID}" \
              -d text="❌ Lunes Host 自动保活 2 失败：代理不可用" \
              --max-time 10 || true
            exit 1
          fi

      - name: 执行保活（第 1 次）
        id: attempt1
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ env.TG_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ env.TG_CHAT_ID }}
          # PROXY_SERVER 由 setup_proxy.sh 写入 $GITHUB_ENV，自动继承，无需在此声明
        run: python scripts/Lunes/Lunes-Keep.py

      - name: 备份第一次截图并等待
        if: steps.attempt1.outcome == 'failure'
        run: |
          if [ -d output/screenshots ]; then
            mkdir -p output/screenshots-attempt1
            find output/screenshots -maxdepth 1 -type f -name "*.png" -exec cp {} output/screenshots-attempt1/ \;
            rm -f output/screenshots/*.png
            echo "已备份第一次截图"
          fi
          echo "等待 60 秒后重试..."
          sleep 60

      - name: 执行保活（第 2 次）
        if: steps.attempt1.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ env.TG_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ env.TG_CHAT_ID }}
          # PROXY_SERVER 由 setup_proxy.sh 写入 $GITHUB_ENV，自动继承，无需在此声明
        run: python scripts/Lunes/Lunes-Keep.py

#      - name: 上传截图
#        uses: actions/upload-artifact@v4
#        if: always()
#        with:
#          name: screenshots-2-${{ github.run_number }}
#          path: |
#            output/screenshots-attempt1/
#            output/screenshots/
#          retention-days: 3
#          if-no-files-found: ignore

  # ========================= 统一清理 =========================
  cleanup:
    name: 清理历史运行记录
    runs-on: ubuntu-latest
    needs: [keepalive-1, keepalive-2]
    if: always()
    steps:
      - name: 清理旧运行
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 3
