name: Rustix 重启

on:
  workflow_dispatch:
    inputs:
      accounts:
        description: '指定邮箱（留空运行全部）'
        required: false
        default: ''

jobs:
  keepalive:
    name: 执行脚本
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 拉取私有仓库
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: .

      - name: 安装 Python 依赖
        run: |
          pip install requests[socks] playwright
          playwright install chromium
          playwright install-deps chromium

      - name: 设置代理
        env:
          NODE_LINK: ${{ secrets.PROXY_NODE_ISP }}  # 改为对应节点变量名 美国 加利福尼亚州 洛杉矶 - ISP
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          chmod +x scripts/setup_proxy.sh
          if ! bash scripts/setup_proxy.sh; then
            echo "❌ 代理设置失败，发送通知..."
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT_ID}" \
              -d parse_mode="HTML" \
              -d text="❌ <b>VPS8 签到失败</b>%0A%0A原因: 代理不可用%0A仓库: ${{ github.repository }}%0A查看: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --max-time 10 || true
            exit 1
          fi
          # 验证环境变量已写入
          echo "✅ PROXY_SERVER 已设置到 GITHUB_ENV"
          grep PROXY_SERVER $GITHUB_ENV || echo "⚠️ 未找到 PROXY_SERVER"

      - name: 执行保活
        env:
          RUSTIX: ${{ secrets.RUSTIX }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # ✅ 直接不写 PROXY_SERVER，让它从 GITHUB_ENV 自动继承
          TARGET_ACCOUNTS: ${{ github.event.inputs.accounts }}
        run: |
          # 验证代理变量是否存在
          echo "PROXY_SERVER=${PROXY_SERVER}"
          if [ -z "$PROXY_SERVER" ]; then
            echo "❌ PROXY_SERVER 为空，代理未生效"
            exit 1
          fi
          python scripts/Rustix/Rustix.py

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustix-screenshots
          path: screenshots/*.png
          retention-days: 3

      - name: 清理旧运行
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 1
