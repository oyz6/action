name: VpsFree.es 续期 2

on:
  workflow_dispatch:
  schedule:
    - cron: '37 12 7 9 *'   # 脚本会根据续期开放时间自动更新此行

permissions:
  contents: write
  actions: write

jobs:
  renew:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: 检出私有仓库
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/scripts
          token: ${{ secrets.REPO_TOKEN }}
          persist-credentials: true

      - name: 检出公开仓库
        if: always()
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_TOKEN }}
          path: main-repo
          persist-credentials: true

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装系统依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb fonts-noto-cjk fonts-wqy-zenhei p7zip-full

      - name: 安装 Python 库
        run: |
          pip install -q seleniumbase requests

      - name: 安装 ChromeDriver
        run: seleniumbase install chromedriver

      - name: 下载并解压扩展
        run: |
          mkdir -p scripts/extensions/nopecha
          wget -q -O scripts/extensions/nopecha/chromium.zip \
            https://github.com/NopeCHALLC/nopecha-extension/releases/download/0.6.1/chromium.zip
          7z x -y scripts/extensions/nopecha/chromium.zip -oscripts/extensions/nopecha/unpacked

      - name: 设置代理
        env:
          NODE_LINK: ${{ secrets.PROXY_NODE }}  # 改为对应节点变量名 （大金）双ISP - US
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          chmod +x scripts/setup_proxy.sh
          if ! bash scripts/setup_proxy.sh; then
            echo "❌ 代理设置失败，发送通知..."
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT_ID}" \
              -d parse_mode="HTML" \
              -d text="❌ <b>VpsFree.es 续期失败</b>%0A%0A原因: 代理不可用%0A仓库: ${{ github.repository }}%0A查看: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --max-time 10 || true
            exit 1
          fi

      - name: 执行续期脚本（第 1 次）
        id: renew_attempt1
        continue-on-error: true
        env:
          VPSFREE: ${{ secrets.VPSFREE_0 }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          NOPECHA_KEY: ${{ secrets.NOPECHA_KEY }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
        run: |
          xvfb-run -a --server-args="-screen 0 1280x720x24" python -u scripts/VpsFree/renew.py 2>&1 | tee output.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          if [ $EXIT_CODE -ne 0 ]; then
            echo "status=failed" >> $GITHUB_OUTPUT
          else
            echo "status=success" >> $GITHUB_OUTPUT
          fi

      - name: 备份第一次截图并等待
        if: steps.renew_attempt1.outputs.status == 'failed'
        run: |
          if [ -d screenshots ]; then
            mv screenshots screenshots-attempt1
            echo "已备份第一次截图"
          fi
          echo "等待 60 秒后重试..."
          sleep 60

      - name: 执行续期脚本（第 2 次）
        if: steps.renew_attempt1.outputs.status == 'failed'
        id: renew_attempt2
        env:
          VPSFREE: ${{ secrets.VPSFREE_0 }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          NOPECHA_KEY: ${{ secrets.NOPECHA_KEY }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
        run: |
          xvfb-run -a --server-args="-screen 0 1280x720x24" python -u scripts/VpsFree/renew.py 2>&1 | tee output.log

      - name: 更新 Cron
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_TOKEN }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          NEXT_RUN_UTC=$(grep -oP 'NEXT_RUN_UTC=\K.*' output.log | tail -1)
          if [ -n "$NEXT_RUN_UTC" ]; then
            echo "下次运行时间 (UTC): $NEXT_RUN_UTC"
            CRON=$(date -u -d "$NEXT_RUN_UTC" +"%-M %-H %-d %-m *")
            echo "新 cron: $CRON"
            cd main-repo

            WORKFLOW_FILE=$(grep -lE "^name:\s*['\"]?$WORKFLOW_NAME['\"]?\s*$" .github/workflows/*.yml .github/workflows/*.yaml 2>/dev/null | head -1)
            if [ -z "$WORKFLOW_FILE" ]; then
              echo "❌ 未找到匹配的工作流文件，跳过 cron 更新"
              exit 1
            fi

            echo "找到工作流文件: $WORKFLOW_FILE"
            sed -i "0,/cron: '.*'/s//cron: '$CRON'/" "$WORKFLOW_FILE"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$WORKFLOW_FILE"
            git commit -m "chore: update cron to $CRON UTC" || echo "没有变更"
            git pull --rebase origin main
            git push
          else
            echo "未检测到 NEXT_RUN_UTC，跳过 cron 更新"
          fi

      # 如需上传截图，可取消注释以下步骤
      # - name: 上传截图
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: screenshots-${{ github.run_number }}
      #     path: |
      #       screenshots/
      #       screenshots-attempt1/
      #     retention-days: 3
      #     if-no-files-found: ignore

      - name: 清理历史运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 1
