name: Hax F1 自动续期

on:
  schedule:
    - cron: '15 4 19 11 *'   # 脚本根据到期时间自动更新
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  NODE_LINK:          ${{ secrets.H1_NODE_LINK || secrets.NODE_LINK }}
  TELEGRAM_PHONE:     ${{ secrets.F1_TELEGRAM_PHONE }}
  TG_STRING_SESSION:  ${{ secrets.F1_TG_STRING_SESSION }}
  TG_BOT_TOKEN:       ${{ secrets.TG_BOT_TOKEN }}
  TG_CHAT_ID:         ${{ secrets.TG_CHAT_ID }}
  TELEGRAM_API_ID:    ${{ secrets.TELEGRAM_API_ID || '2040' }}
  TELEGRAM_API_HASH:  ${{ secrets.TELEGRAM_API_HASH || 'b18441a1ff607e10a989891a5462e627' }}
  OPENAI_API_KEY:     ${{ secrets.HAX_OPENAI_API_KEY }}
  OPENAI_BASE_URL:    ${{ secrets.HAX_OPENAI_BASE_URL }}
  OPENAI_MODEL:       ${{ secrets.HAX_OPENAI_MODEL }}
  REPO_TOKEN:         ${{ secrets.REPO_TOKEN }}
  HAX_COOKIE:         ${{ secrets.F1_HAX_COOKIE }}

jobs:
  renew-f1:
    name: Hax F1 续期
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: 检出私有脚本仓库
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: .

      - name: 检出主仓库（用于更新 cron）
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_TOKEN }}
          path: main-repo
          persist-credentials: true

      - name: 检查账号配置
        id: check_acc
        run: |
          if [ -z "${{ env.TELEGRAM_PHONE }}" ] || [ -z "${{ env.TG_STRING_SESSION }}" ]; then
            echo "has_acc=false" >> $GITHUB_OUTPUT
            echo "⚠️ [跳过] Hax F1 账号未配置 (F1_TELEGRAM_PHONE 或 F1_TG_STRING_SESSION 缺失)"
          else
            echo "has_acc=true" >> $GITHUB_OUTPUT
          fi

      - name: 配置 Python 3.11
        if: steps.check_acc.outputs.has_acc == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/Hax/requirements.txt'

      - name: 安装基础依赖
        if: steps.check_acc.outputs.has_acc == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            curl \
            libglib2.0-0 \
            libnss3 \
            libgconf-2-4 \
            libfontconfig1 \
            python3-tk \
            python3-dev \
            jq
          python -m pip install --upgrade pip wheel setuptools
          pip install -r scripts/Hax/requirements.txt
          sbase install chromedriver

      - name: 设置代理
        if: steps.check_acc.outputs.has_acc == 'true'
        env:
          NODE_LINK: ${{ env.NODE_LINK }}
          TG_BOT_TOKEN: ${{ env.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ env.TG_CHAT_ID }}
        run: |
          chmod +x scripts/setup_proxy.sh
          if ! bash scripts/setup_proxy.sh; then
            echo "❌ 代理设置失败，发送通知..."
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT_ID}" \
              -d parse_mode="HTML" \
              -d text="❌ <b>F1 Hax 续期失败</b>%0A%0A原因: 代理不可用%0A仓库: ${{ github.repository }}%0A查看: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --max-time 10 || true
            exit 1
          fi
          if [ -f proxy.env ]; then
            cat proxy.env >> $GITHUB_ENV
          fi

      - name: 执行续期（第 1 次）
        id: attempt1
        continue-on-error: true
        if: steps.check_acc.outputs.has_acc == 'true'
        env:
          ACCOUNT_NAME: "F1"
          ACCOUNT_INDEX: "1"
          TELEGRAM_PHONE: ${{ env.TELEGRAM_PHONE }}
          TG_STRING_SESSION: ${{ env.TG_STRING_SESSION }}
          TELEGRAM_API_ID: ${{ env.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ env.TELEGRAM_API_HASH }}
          TG_BOT_TOKEN: ${{ env.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ env.TG_CHAT_ID }}
          REPO_TOKEN: ${{ env.REPO_TOKEN }}
          HAX_COOKIE: ${{ env.HAX_COOKIE }}
          OPENAI_API_KEY: ${{ env.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ env.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ env.OPENAI_MODEL }}
          IS_PROXY: ${{ env.IS_PROXY }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
        run: |
          set -o pipefail
          xvfb-run -a --server-args="-screen 0 1280x720x24" python -u scripts/Hax/hax_renw.py 2>&1 | tee output.log

      - name: 备份第一次截图并等待
        if: steps.check_acc.outputs.has_acc == 'true' && steps.attempt1.outcome == 'failure'
        run: |
          if [ -d screenshots ]; then
            mkdir -p screenshots-attempt1
            find screenshots -maxdepth 1 -type f -name "*.png" -exec cp {} screenshots-attempt1/ \;
            rm -f screenshots/*.png
            echo "已备份第一次截图"
          fi
          echo "等待 30 秒后重试..."
          sleep 30

      - name: 执行续期（第 2 次）
        if: steps.check_acc.outputs.has_acc == 'true' && steps.attempt1.outcome == 'failure'
        env:
          ACCOUNT_NAME: "F1"
          ACCOUNT_INDEX: "1"
          TELEGRAM_PHONE: ${{ env.TELEGRAM_PHONE }}
          TG_STRING_SESSION: ${{ env.TG_STRING_SESSION }}
          TELEGRAM_API_ID: ${{ env.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ env.TELEGRAM_API_HASH }}
          TG_BOT_TOKEN: ${{ env.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ env.TG_CHAT_ID }}
          REPO_TOKEN: ${{ env.REPO_TOKEN }}
          HAX_COOKIE: ${{ env.HAX_COOKIE }}
          OPENAI_API_KEY: ${{ env.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ env.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ env.OPENAI_MODEL }}
          IS_PROXY: ${{ env.IS_PROXY }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
        run: |
          set -o pipefail
          xvfb-run -a --server-args="-screen 0 1280x720x24" python -u scripts/Hax/hax_renw.py 2>&1 | tee output.log

#      - name: 上传截图 (成功或失败均保留)
#        if: always() && steps.check_acc.outputs.has_acc == 'true'
#        uses: actions/upload-artifact@v4
#        with:
#          name: hax-screenshots-f1
#          path: |
#            screenshots-attempt1/
#            screenshots/
#          if-no-files-found: ignore
#          retention-days: 7

      - name: 更新 Cron
        if: always() && steps.check_acc.outputs.has_acc == 'true'
        env:
          WORKFLOW_FILE: ".github/workflows/hax_f1.yml"
          ACCOUNT_TAG: "Hax-F1"
        run: |
          if [ ! -f output.log ]; then
            echo "未找到 output.log，跳过 cron 更新"
            exit 0
          fi
          NEXT_RUN_UTC=$(grep -oP 'NEXT_RUN_UTC=\K.*' output.log | tail -1)
          if [ -z "$NEXT_RUN_UTC" ]; then
            echo "未检测到 NEXT_RUN_UTC，跳过 cron 更新"
            exit 0
          fi
          echo "下次运行时间 (UTC): $NEXT_RUN_UTC"
          CRON=$(date -u -d "$NEXT_RUN_UTC" +"%-M %-H %-d %-m *")
          echo "新 cron: $CRON"

            cd main-repo
          if [ ! -f "$WORKFLOW_FILE" ]; then
            echo "❌ 未找到工作流文件 $WORKFLOW_FILE，跳过 cron 更新"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          COMMIT_MSG="[$ACCOUNT_TAG] 下次执行时间：$(date -u -d "$NEXT_RUN_UTC" '+%Y年%m月%d日 %H:%M UTC')"

          for i in 1 2 3; do
            echo "--- 第 $i 次尝试更新 cron ---"
            git fetch origin main
            git reset --hard origin/main

            sed -i "0,/cron: '.*'/s//cron: '$CRON'/" "$WORKFLOW_FILE"
            git add "$WORKFLOW_FILE"

            if git diff --cached --quiet; then
              echo "cron 无变化，跳过提交"
              exit 0
            fi

            git commit -m "$COMMIT_MSG"
            if git push origin main; then
              echo "✅ cron 更新已推送"
              exit 0
            fi

            echo "⚠️ 推送失败，5 秒后重试..."
            sleep 5
          done

          echo "❌ cron 更新推送失败（已重试 3 次）"
          exit 1

      - name: 清理旧的工作流运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 2
