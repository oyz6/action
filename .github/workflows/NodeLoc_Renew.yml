name: NodeLoc 签到（并行）

on:
  schedule:
    - cron: '05 4 * * *'          # 每天北京时间 12:05
  workflow_dispatch:
    inputs:
      debug:
        description: '调试模式'
        required: false
        default: false
        type: boolean
      enable_f1:
        description: '启用 F1 签到'
        required: false
        default: true
        type: boolean
      enable_f2:
        description: '启用 F2 签到'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  actions: write

# ================== 账号配置区（只改这里） ==================
env:
  PYTHON_VERSION: '3.11'
  CHROME_VERSION: '131'

  # ---------- F1 账号 ----------
  F1_NODE_LINK:  ${{ secrets.PROXY_NODE }}
  F1_NL_ACCOUNT: ${{ secrets.F1_NL_ACCOUNT }}        # 格式: 用户名----密码 (支持带Cookie)
  F1_STAGGER:    "0"                                                       # 错峰等待秒数

  # ---------- F2 账号 ----------
  F2_NODE_LINK: ${{ secrets.PROXY_NODE_US_ISP }}      # 美国 洛杉矶 ISP
  F2_NL_ACCOUNT: ${{ secrets.F2_NL_ACCOUNT }}
  F2_STAGGER:    "20"

  # ---------- 公共配置 ----------
  TG_BOT_TOKEN:   ${{ secrets.TG_BOT_TOKEN }}
  TG_CHAT_ID:     ${{ secrets.TG_CHAT_ID }}
  REPO_TOKEN:     ${{ secrets.REPO_TOKEN }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
  OPENAI_MODEL:   ${{ secrets.OPENAI_MODEL }}

jobs:
  # ========================= F1 =========================
  sign-f1:
    name: F1 签到
    if: ${{ github.event_name == 'schedule' || inputs.enable_f1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 错峰等待
        run: sleep ${{ env.F1_STAGGER }}

      - name: 拉取私有仓库
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: .

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: nodeloc/requirements.txt

      - name: 安装 Chrome 浏览器
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: ${{ env.CHROME_VERSION }}
          install-chromedriver: false

      - name: 安装系统依赖与字体
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb fonts-noto-cjk fonts-wqy-zenhei git jq curl
          fc-cache -f > /dev/null 2>&1

      - name: 安装 Python 依赖
        run: |
          pip install -q --upgrade pip
          pip install -q -r nodeloc/requirements.txt
          playwright install chromium > /dev/null 2>&1

      - name: 安装 ChromeDriver
        run: seleniumbase install chromedriver

      - name: 克隆人机验证组件
        run: |
          if [ ! -d "hcaptcha-challenger" ]; then
            git clone --depth 1 -q https://github.com/oyz6/hcaptcha.git hcaptcha-challenger
          fi

      - name: 创建截图目录
        run: mkdir -p /tmp/screenshots screenshots

      - name: 设置代理
        env:
          NODE_LINK: ${{ env.F1_NODE_LINK }}          # ← 通过 env 传，不内插
        run: |
          chmod +x scripts/setup_proxy.sh
          if ! bash scripts/setup_proxy.sh; then
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT_ID}" \
              -d parse_mode="HTML" \
              -d text="❌ <b>F1 NodeLoc 签到失败</b>%0A%0A原因: 代理不可用%0A仓库: ${{ github.repository }}%0A查看: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --max-time 10 || true
            exit 1
          fi

      - name: 执行签到与日常互动
        env:
          NODE_LINK:          ${{ env.F1_NODE_LINK }}
          NL_ACCOUNT:         ${{ env.F1_NL_ACCOUNT }}
          TARGET_SECRET_NAME: 'F1_NL_ACCOUNT'
          REPO_TOKEN:         ${{ env.REPO_TOKEN }}
          OPENAI_API_KEY:     ${{ env.OPENAI_API_KEY }}
          OPENAI_BASE_URL:    ${{ env.OPENAI_BASE_URL }}
          OPENAI_MODEL:       ${{ env.OPENAI_MODEL }}
          TG_BOT_TOKEN:       ${{ env.TG_BOT_TOKEN }}
          TG_CHAT_ID:         ${{ env.TG_CHAT_ID }}
          CHROME_PATH:        ${{ steps.setup-chrome.outputs.chrome-path }}
          DEBUG:              ${{ github.event.inputs.debug == 'true' && '1' || '0' }}
        run: |
          xvfb-run -a --server-args="-screen 0 1280x720x24" python -u nodeloc/main.py

#      - name: 上传异常排查截图
#        if: failure() && github.event.inputs.debug == 'true'
#        uses: actions/upload-artifact@v4
#        with:
#          name: screenshots-f1-${{ github.run_number }}
#          path: /tmp/screenshots/*.png
#          retention-days: 1
#          if-no-files-found: ignore

  # ========================= F2 =========================
  sign-f2:
    name: F2 签到
    if: ${{ github.event_name == 'schedule' || inputs.enable_f2 }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 错峰等待
        run: sleep ${{ env.F2_STAGGER }}

      - name: 拉取私有仓库
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: .

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: nodeloc/requirements.txt

      - name: 安装 Chrome 浏览器
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: ${{ env.CHROME_VERSION }}
          install-chromedriver: false

      - name: 安装系统依赖与字体
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb fonts-noto-cjk fonts-wqy-zenhei git jq curl
          fc-cache -f > /dev/null 2>&1

      - name: 安装 Python 依赖
        run: |
          pip install -q --upgrade pip
          pip install -q -r nodeloc/requirements.txt
          playwright install chromium > /dev/null 2>&1

      - name: 安装 ChromeDriver
        run: seleniumbase install chromedriver

      - name: 克隆人机验证组件
        run: |
          if [ ! -d "hcaptcha-challenger" ]; then
            git clone --depth 1 -q https://github.com/oyz6/hcaptcha.git hcaptcha-challenger
          fi

      - name: 创建截图目录
        run: mkdir -p /tmp/screenshots screenshots

      - name: 设置代理
        env:
          NODE_LINK: ${{ env.F2_NODE_LINK }}
        run: |
          chmod +x scripts/setup_proxy.sh
          if ! bash scripts/setup_proxy.sh; then
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT_ID}" \
              -d parse_mode="HTML" \
              -d text="❌ <b>F2 NodeLoc 签到失败</b>%0A%0A原因: 代理不可用%0A仓库: ${{ github.repository }}%0A查看: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --max-time 10 || true
            exit 1
          fi

      - name: 执行签到与日常互动
        env:
          NODE_LINK:          ${{ env.F2_NODE_LINK }}
          NL_ACCOUNT:         ${{ env.F2_NL_ACCOUNT }}
          TARGET_SECRET_NAME: 'F2_NL_ACCOUNT'
          REPO_TOKEN:         ${{ env.REPO_TOKEN }}
          OPENAI_API_KEY:     ${{ env.OPENAI_API_KEY }}
          OPENAI_BASE_URL:    ${{ env.OPENAI_BASE_URL }}
          OPENAI_MODEL:       ${{ env.OPENAI_MODEL }}
          TG_BOT_TOKEN:       ${{ env.TG_BOT_TOKEN }}
          TG_CHAT_ID:         ${{ env.TG_CHAT_ID }}
          CHROME_PATH:        ${{ steps.setup-chrome.outputs.chrome-path }}
          DEBUG:              ${{ github.event.inputs.debug == 'true' && '1' || '0' }}
        run: |
          xvfb-run -a --server-args="-screen 0 1280x720x24" python -u nodeloc/main.py

#      - name: 上传异常排查截图
#        if: failure() && github.event.inputs.debug == 'true'
#        uses: actions/upload-artifact@v4
#        with:
#          name: screenshots-f2-${{ github.run_number }}
#          path: /tmp/screenshots/*.png
#          retention-days: 1
#          if-no-files-found: ignore

  # ========================= 统一清理 =========================
  cleanup:
    name: 清理历史运行记录
    runs-on: ubuntu-latest
    needs: [sign-f1, sign-f2]
    if: always()
    steps:
      - name: 清理历史运行记录（保留最近1次）
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 1
