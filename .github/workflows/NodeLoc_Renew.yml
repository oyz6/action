name: NodeLoc 签到（并行）

on:
  schedule:
    - cron: '05 4 * * *'          # 每天北京时间 12:05
  workflow_dispatch:
    inputs:
      debug:
        description: '调试模式'
        required: false
        default: false
        type: boolean
      enable_f1:
        description: '启用 F1 签到'
        required: false
        default: true
        type: boolean
      enable_f2:
        description: '启用 F2 签到'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  actions: write

# ================== 账号配置区（只改这里） ==================
env:
  PYTHON_VERSION: '3.11'
  CHROME_VERSION: '131'

  # ---------- F1 账号 ----------
  F1_NODE_LINK:  ${{ secrets.PROXY_NODE }}            # 大金 双ISP - US
  F1_NL_ACCOUNT: ${{ secrets.NL_ACCOUNT }}            # 格式: 用户名----密码（多账号换行）
  F1_STAGGER:    "0"                                   # 错峰等待秒数

  # ---------- F2 账号 ----------
#  F2_NODE_LINK:  ${{ secrets.PROXY_NODE_360t7 }}      # 360t7 美国一年 - 双ISP - US
  F2_NODE_LINK: ${{ secrets.PROXY_NODE_US_ISP }}      # 美国 洛杉矶 ISP
  F2_NL_ACCOUNT: ${{ secrets.NL_ACCOUNT_TEST }}
  F2_STAGGER:    "20"

  # ---------- 公共配置 ----------
  TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
  TG_CHAT_ID:   ${{ secrets.TG_CHAT_ID }}

jobs:
  # ========================= F1 =========================
  sign-f1:
    name: F1 签到
    if: ${{ github.event_name == 'schedule' || inputs.enable_f1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 错峰等待
        run: sleep ${{ env.F1_STAGGER }}

      - name: 拉取私有仓库
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: .

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: nodeloc/requirements.txt

      - name: 安装 Chrome 浏览器
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: ${{ env.CHROME_VERSION }}
          install-chromedriver: false

      - name: 安装中文字体
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-wqy-zenhei
          fc-cache -fv

      - name: 安装 Python 依赖
        run: |
          pip install --upgrade pip
          pip install -r nodeloc/requirements.txt

      - name: 创建截图目录
        run: mkdir -p /tmp/screenshots

      - name: 设置代理
        env:
          NODE_LINK: ${{ env.F1_NODE_LINK }}          # ← 通过 env 传，不内插
        run: |
          chmod +x scripts/setup_proxy.sh
          if ! bash scripts/setup_proxy.sh; then
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT_ID}" \
              -d parse_mode="HTML" \
              -d text="❌ <b>F1 NodeLoc 签到失败</b>%0A%0A原因: 代理不可用%0A仓库: ${{ github.repository }}%0A查看: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --max-time 10 || true
            exit 1
          fi

      - name: 执行签到
        env:
          NODE_LINK:   ${{ env.F1_NODE_LINK }}          # ← 同样通过 env
          NL_ACCOUNT:  ${{ env.F1_NL_ACCOUNT }}         # ← 多行 secret 也安全
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          DEBUG: ${{ github.event.inputs.debug == 'true' && '1' || '0' }}
        run: |
          if [ "$DEBUG" == "1" ]; then
            echo "🔍 调试模式开启（F1）"
            python -c "import undetected_chromedriver as uc; print('undetected_chromedriver 版本:', uc.__version__)"
          fi
          python nodeloc/main-test.py

#      - name: 上传调试截图
#        if: always()
#        uses: actions/upload-artifact@v4
#        with:
#          name: screenshots-f1-${{ github.run_number }}
#          path: /tmp/screenshots/
#          retention-days: 3
#          if-no-files-found: ignore

  # ========================= F2 =========================
  sign-f2:
    name: F2 签到
    if: ${{ github.event_name == 'schedule' || inputs.enable_f2 }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 错峰等待
        run: sleep ${{ env.F2_STAGGER }}

      - name: 拉取私有仓库
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: .

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: nodeloc/requirements.txt

      - name: 安装 Chrome 浏览器
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: ${{ env.CHROME_VERSION }}
          install-chromedriver: false

      - name: 安装中文字体
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-wqy-zenhei
          fc-cache -fv

      - name: 安装 Python 依赖
        run: |
          pip install --upgrade pip
          pip install -r nodeloc/requirements.txt

      - name: 创建截图目录
        run: mkdir -p /tmp/screenshots

      - name: 设置代理
        env:
          NODE_LINK: ${{ env.F2_NODE_LINK }}
        run: |
          chmod +x scripts/setup_proxy.sh
          if ! bash scripts/setup_proxy.sh; then
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT_ID}" \
              -d parse_mode="HTML" \
              -d text="❌ <b>F2 NodeLoc 签到失败</b>%0A%0A原因: 代理不可用%0A仓库: ${{ github.repository }}%0A查看: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --max-time 10 || true
            exit 1
          fi

      - name: 执行签到
        env:
          NODE_LINK:   ${{ env.F2_NODE_LINK }}
          NL_ACCOUNT:  ${{ env.F2_NL_ACCOUNT }}
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          DEBUG: ${{ github.event.inputs.debug == 'true' && '1' || '0' }}
        run: |
          if [ "$DEBUG" == "1" ]; then
            echo "🔍 调试模式开启（F2）"
            python -c "import undetected_chromedriver as uc; print('undetected_chromedriver 版本:', uc.__version__)"
          fi
          python nodeloc/main-test.py

#      - name: 上传调试截图
#        if: always()
#        uses: actions/upload-artifact@v4
#        with:
#          name: screenshots-f2-${{ github.run_number }}
#          path: /tmp/screenshots/
#          retention-days: 3
#          if-no-files-found: ignore

  # ========================= 统一清理 =========================
  cleanup:
    name: 清理历史运行记录
    runs-on: ubuntu-latest
    needs: [sign-f1, sign-f2]
    if: always()
    steps:
      - name: 清理历史运行记录（保留最近1次）
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 1
