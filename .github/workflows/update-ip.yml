name: 更新全球 IP 数据库

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  update:
    name: 更新全球 IP 数据库
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 临时生成 package.json 并安装依赖
        run: |
          cat > package.json << 'EOF'
          {
            "name": "ip-db-updater",
            "private": true,
            "dependencies": {
              "maxmind": "^4.3.23"
            }
          }
          EOF
          npm install

      - name: 智能选择并下载最新的 GeoLite2 国家数据库
        run: |
          mkdir -p data
          
          # 定义三个源及其资产文件名
          declare -A SOURCES=(
            ["Loyalsoldier/geoip"]="Country.mmdb"
            ["Dreamacro/maxmind-geoip"]="Country.mmdb"
            ["P3TERX/GeoLite.mmdb"]="GeoLite2-Country.mmdb"
          )
          
          LATEST_REPO=""
          LATEST_TIME="1970-01-01T00:00:00Z"
          LATEST_ASSET=""
          
          echo "🔍 正在检测三个源的最新 Release 时间..."
          for REPO in "${!SOURCES[@]}"; do
            ASSET="${SOURCES[$REPO]}"
            echo "  检查 $REPO ..."
            PUBLISHED=$(curl -s "https://api.github.com/repos/${REPO}/releases/latest" | jq -r '.published_at // empty')
            
            if [[ -n "$PUBLISHED" ]]; then
              echo "    -> 发现更新版本: $PUBLISHED"
              if [[ "$PUBLISHED" > "$LATEST_TIME" ]]; then
                LATEST_TIME="$PUBLISHED"
                LATEST_REPO="$REPO"
                LATEST_ASSET="$ASSET"
              fi
            else
              echo "    -> API 获取失败，跳过该源"
            fi
          done
          
          if [[ -z "$LATEST_REPO" ]]; then
            echo "⚠️ 所有 API 检测失败，采用默认最优源 (Loyalsoldier/geoip)..."
            LATEST_REPO="Loyalsoldier/geoip"
            LATEST_ASSET="Country.mmdb"
          fi
          
          echo "✅ 最终选定最最新源: $LATEST_REPO (发布时间: $LATEST_TIME)"
          DOWNLOAD_URL="https://github.com/${LATEST_REPO}/releases/latest/download/${LATEST_ASSET}"
          echo "📥 下载地址: $DOWNLOAD_URL"
          
          curl -s -L -o data/GeoLite2-Country.mmdb "$DOWNLOAD_URL"
          
          if [ ! -f data/GeoLite2-Country.mmdb ] || [ $(stat -c%s data/GeoLite2-Country.mmdb) -lt 1000000 ]; then
            echo "⚠️ 下载文件过小或失败，立即使用硬编码兜底 (Loyalsoldier/geoip)..."
            curl -s -L -o data/GeoLite2-Country.mmdb "https://github.com/Loyalsoldier/geoip/releases/latest/download/Country.mmdb"
          fi
          
          echo "🎉 数据库下载并保存成功。"

      - name: 执行更新脚本
        run: node scripts/update-db.js

      - name: 生成 Release 描述并发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNTRY_COUNT=$(jq -r '.country_count' data/ip-database.json)
          COVERAGE=$(jq -r '.coverage_rate' data/ip-database.json)
          UPDATED=$(jq -r '.updated_at' data/ip-database.json)
          MISSING=$(jq -r '.missing | if length > 0 then join(", ") else "无" end' data/ip-database.json)

          NOTES="## 🌍 全球 IP 数据库更新报告

          | 项目 | 详情 |
          |------|------|
          | 📊 覆盖国家数 | ${COUNTRY_COUNT} |
          | 📈 覆盖率 | ${COVERAGE} |
          | ⚠️ 缺失国家 | ${MISSING} |
          | 🕒 更新时间 | ${UPDATED} |
          | 🗂️ 数据来源 | RIR Delegated + 最新 MaxMind GeoLite2 + mra8-api 验证 |

          > 数据文件：\`ip-database.json\`，可直接下载用于代理分流、地域识别等场景。
          "

          if gh release view ip-database > /dev/null 2>&1; then
            gh release edit ip-database --title "IP Database (${COUNTRY_COUNT} 个国家)" --notes "$NOTES"
            gh release upload ip-database data/ip-database.json --clobber
          else
            gh release create ip-database data/ip-database.json \
              --title "IP Database (${COUNTRY_COUNT} 个国家)" \
              --notes "$NOTES" \
              --latest
          fi

      - name: 失败时通知
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="❌ <b>IP 数据库更新失败</b>%0A%0A仓库: ${{ github.repository }}%0A查看: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: 清理工作流记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 3
