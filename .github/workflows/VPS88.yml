name: VPS8 签到（并行）

on:
  workflow_dispatch:
    inputs:
      enable_f1:
        description: '启用 F1 签到'
        default: true
        type: boolean
      enable_f2:
        description: '启用 F2 签到'
        default: true
        type: boolean
      enable_f3:
        description: '启用 F3 签到'
        default: true
        type: boolean

permissions:
  contents: read
  actions: write

env:
  VPS8_RENEW_TEST: "0"
  # Telegram 通知
  TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
  TG_CHAT_ID:   ${{ secrets.TG_CHAT_ID }}

  # OpenAI 视觉模型（hCaptcha AI 破解用）
  OPENAI_API_KEY:  ${{ secrets.OPENAI_API_KEY }}
  OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
  OPENAI_MODEL:    ${{ secrets.OPENAI_MODEL }}

  # NopeCHA Key（多个换行分隔）
  NOPECHA_KEY: ${{ secrets.NOPECHA_KEY }}

jobs:
  sign:
    name: ${{ matrix.slug }} · VPS8
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: F1
            node_secret:    PROXY_NODE_360t7   # 360t7 美国一年 - 双ISP
            account_secret: VPS8               # → secrets.VPS8
            stagger:        0
            enable:         ${{ inputs.enable_f1 }}

          - slug: F2
            node_secret:    PROXY_NODE         # 大金 双ISP - US
            account_secret: VPS82              # → secrets.VPS82
            stagger:        20
            enable:         ${{ inputs.enable_f2 }}

          - slug: F3
            node_secret:    PROXY_NODE_US_ISP  # 美国 洛杉矶 ISP
            account_secret: VPS83              # → secrets.VPS83
            stagger:        40
            enable:         ${{ inputs.enable_f3 }}

    env:
      NODE_LINK: ${{ secrets[matrix.node_secret] }}
      VPS8: ${{ secrets[matrix.account_secret] }}

    steps:
      - name: 跳过检查
        if: ${{ matrix.enable == false }}
        run: |
          echo "[skip] ${{ matrix.slug }} 已关闭，退出"
          exit 0

      - name: 启动 · 错峰
        if: ${{ matrix.stagger > 0 }}
        run: sleep ${{ matrix.stagger }}

      - name: 检出代码
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/scripts
          token: ${{ secrets.REPO_TOKEN }}

      - name: 配置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 缓存 pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ github.job }}-v4
          restore-keys: ${{ runner.os }}-pip-${{ github.job }}-

      - name: 安装系统依赖
        run: |
          echo "::group::apt-get"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb fonts-noto-cjk p7zip-full git
          echo "::endgroup::"

      - name: 安装 Python 库
        run: |
          echo "::group::pip"
          pip install -q \
            seleniumbase requests playwright opencv-python-headless \
            msgpack typer matplotlib google-genai httpx \
            loguru pydantic-settings tenacity pytz
          echo "::endgroup::"

      - name: 安装 ChromeDriver
        run: seleniumbase install chromedriver

      - name: 准备 NopeCHA 扩展
        run: |
          echo "::group::nopecha-extension"
          mkdir -p scripts/extensions/nopecha
          wget -q -O scripts/extensions/nopecha/chromium.zip \
            https://github.com/NopeCHALLC/nopecha-extension/releases/download/0.6.1/chromium.zip
          7z x -y scripts/extensions/nopecha/chromium.zip \
            -oscripts/extensions/nopecha/unpacked
          echo "::endgroup::"

      - name: 准备 hCaptcha Challenger
        run: |
          echo "::group::hcaptcha-challenger"
          git clone --depth 1 https://github.com/aoi675145/hcaptcha.git hcaptcha-challenger
          cd hcaptcha-challenger
          git fetch --depth 1 origin d4da375916cde6bb85128eb8fc9859e1f06cacbc \
            && git checkout --detach FETCH_HEAD \
            || echo "[WARN] 固定 commit 获取失败，使用 HEAD"
          git rev-parse HEAD
          echo "::endgroup::"

      - name: 设置代理
        run: |
          chmod +x scripts/setup_proxy.sh
          if ! bash scripts/setup_proxy.sh; then
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT_ID}" \
              -d parse_mode="HTML" \
              -d text="❌ <b>${{ matrix.slug }} VPS8 签到失败</b>%0A原因: 代理不可用%0A仓库: ${{ github.repository }}%0A查看: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --max-time 10 || true
            exit 1
          fi

      - name: 执行签到（第 1 次）
        id: attempt1
        continue-on-error: true
        run: |
          echo "::group::[${{ matrix.slug }}] 第 1 次执行"
          xvfb-run -a --server-args="-screen 0 1280x720x24" \
            python -u scripts/VPS8/main_ai.py
          echo "::endgroup::"

      - name: 备份截图并等待
        if: steps.attempt1.outcome == 'failure'
        run: |
          if [ -d screenshots ]; then
            mkdir -p screenshots-attempt1
            find screenshots -maxdepth 1 -type f -name "*.png" \
              -exec cp {} screenshots-attempt1/ \;
            rm -f screenshots/*.png
          fi
          echo "[info] 60s 后重试"
          sleep 60

      - name: 执行签到（第 2 次）
        if: steps.attempt1.outcome == 'failure'
        run: |
          echo "::group::[${{ matrix.slug }}] 第 2 次执行"
          xvfb-run -a --server-args="-screen 0 1280x720x24" \
            python -u scripts/VPS8/main_ai.py
          echo "::endgroup::"

#      - name: 上传截图
#        if: ${{ always() && matrix.enable }}
#        uses: actions/upload-artifact@v4
#        with:
#          name: screenshots-${{ matrix.slug }}-${{ github.run_number }}
#          path: |
#            screenshots-attempt1/
#            screenshots/
#          retention-days: 7
#          if-no-files-found: ignore

  cleanup:
    name: 清理历史运行
    runs-on: ubuntu-22.04
    needs: [sign]
    if: always()
    steps:
      - uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 1
