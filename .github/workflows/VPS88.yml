name: VPS8 签到（矩阵并行）

on:
  workflow_dispatch:
    inputs:
      enable_f1:
        description: '启用 F1 签到'
        required: false
        default: true
        type: boolean
      enable_f2:
        description: '启用 F2 签到'
        required: false
        default: true
        type: boolean
      enable_f3:
        description: '启用 F3 签到'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  actions: write

# 公共变量（与账号无关）
env:
  VPS8_RENEW_TEST: "0"
  TG_BOT_TOKEN:    ${{ secrets.TG_BOT_TOKEN }}
  TG_CHAT_ID:      ${{ secrets.TG_CHAT_ID }}
  OPENAI_API_KEY:  ${{ secrets.OPENAI_API_KEY }}   # 对应服务的 key
  OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}  # 对应服务的 base_url
  OPENAI_MODEL:    ${{ secrets.OPENAI_MODEL }}     # 对应的 vision 模型名
  NOPECHA_KEY:     ${{ secrets.NOPECHA_KEY }}

jobs:
  sign:
    name: ${{ matrix.label }} 签到
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false      # 单路失败不影响其他账号
      max-parallel: 3
      
      # 核心配置区：以后新增账号 / 修改代理 / 修改错峰时间，只改这里
      matrix:
        include:
          # ---------- F1 账号 ----------
          - label: F1
            enabled: ${{ inputs.enable_f1 }}
            node_link: ${{ secrets.PROXY_NODE_360t7 }}   # 360t7 美国一年 - 双ISP
            account:   ${{ secrets.VPS8 }}               # 账号密钥名
            stagger:   0                                 # 错峰等待秒数
            
          # ---------- F2 账号 ----------
          - label: F2
            enabled: ${{ inputs.enable_f2 }}
            node_link: ${{ secrets.PROXY_NODE }}         # 大金 双ISP - US
            account:   ${{ secrets.VPS82 }}
            stagger:   20
            
          # ---------- F3 账号 ----------
          - label: F3
            enabled: ${{ inputs.enable_f3 }}
            node_link: ${{ secrets.PROXY_NODE_US_ISP }}  # 美国 洛杉矶 ISP
            account:   ${{ secrets.VPS83 }}
            stagger:   40

    steps:
      # ---------- 错峰 ----------
      - name: 错峰等待
        if: matrix.enabled == 'true'
        env:
          STAGGER: ${{ matrix.stagger }}
        run: |
          echo "::group::错峰等待 ${STAGGER}s"
          sleep "${STAGGER}"
          echo "::endgroup::"

      # ---------- 检出 / 环境 ----------
      - name: 检出代码仓库
        if: matrix.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/scripts
          token: ${{ secrets.REPO_TOKEN }}

      - name: 配置 Python 3.11
        if: matrix.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 缓存 pip
        if: matrix.enabled == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ github.job }}-v3
          restore-keys: |
            ${{ runner.os }}-pip-${{ github.job }}-

      - name: 安装系统依赖
        if: matrix.enabled == 'true'
        run: |
          echo "::group::apt install"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb fonts-noto-cjk p7zip-full git
          echo "::endgroup::"

      - name: 安装 Python 库
        if: matrix.enabled == 'true'
        run: |
          echo "::group::pip install"
          pip install -q seleniumbase requests playwright opencv-python-headless \
                        msgpack typer matplotlib google-genai httpx \
                        loguru pydantic-settings tenacity pytz
          echo "::endgroup::"

      - name: 安装 ChromeDriver
        if: matrix.enabled == 'true'
        run: seleniumbase install chromedriver

      - name: 下载 NopeCHA 扩展
        if: matrix.enabled == 'true'
        run: |
          echo "::group::NopeCHA extension"
          mkdir -p scripts/extensions/nopecha
          wget -q -O scripts/extensions/nopecha/chromium.zip \
            https://github.com/NopeCHALLC/nopecha-extension/releases/download/0.6.1/chromium.zip
          7z x -y scripts/extensions/nopecha/chromium.zip -oscripts/extensions/nopecha/unpacked
          echo "::endgroup::"

      - name: 克隆 hcaptcha-challenger
        if: matrix.enabled == 'true'
        run: |
          echo "::group::hcaptcha-challenger clone"
          git clone --depth 1 https://github.com/aoi675145/hcaptcha.git hcaptcha-challenger
          cd hcaptcha-challenger
          git fetch --depth 1 origin d4da375916cde6bb85128eb8fc9859e1f06cacbc \
            && git checkout --detach FETCH_HEAD \
            || echo "[WARN] 固定 commit 获取失败，使用克隆时的 main HEAD"
          git rev-parse HEAD
          echo "::endgroup::"

      # ---------- 代理 ----------
      - name: 设置代理
        if: matrix.enabled == 'true'
        env:
          NODE_LINK: ${{ matrix.node_link }}
          LABEL:     ${{ matrix.label }}
        run: |
          chmod +x scripts/setup_proxy.sh
          if ! bash scripts/setup_proxy.sh; then
            echo "::error::代理不可用"
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT_ID}" \
              -d parse_mode="HTML" \
              -d text="❌ <b>${LABEL} VPS8 签到失败</b>%0A%0A原因: 代理不可用%0A仓库: ${{ github.repository }}%0A查看: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --max-time 10 || true
            exit 1
          fi

      # ---------- 签到 ----------
      - name: 执行签到（第 1 次）
        if: matrix.enabled == 'true'
        id: attempt1
        continue-on-error: true
        env:
          VPS8: ${{ matrix.account }}
        run: |
          echo "::group::签到尝试 #1"
          xvfb-run -a --server-args="-screen 0 1280x720x24" \
            python -u scripts/VPS8/main_ai.py
          echo "::endgroup::"

      - name: 备份失败截图并等待
        if: matrix.enabled == 'true' && steps.attempt1.outcome == 'failure'
        run: |
          if [ -d screenshots ]; then
            mkdir -p screenshots-attempt1
            find screenshots -maxdepth 1 -name "*.png" -exec cp {} screenshots-attempt1/ \;
            rm -f screenshots/*.png
            echo "已备份第 1 次失败的截图"
          fi
          echo "等待 60s 后重试..."
          sleep 60

      - name: 执行签到（第 2 次）
        if: matrix.enabled == 'true' && steps.attempt1.outcome == 'failure'
        env:
          VPS8: ${{ matrix.account }}
        run: |
          echo "::group::签到尝试 #2"
          xvfb-run -a --server-args="-screen 0 1280x720x24" \
            python -u scripts/VPS8/main_ai.py
          echo "::endgroup::"

      # ---------- 上传所有截图 ----------
#      - name: 上传所有截图
#        if: always() && matrix.enabled == 'true'
#        uses: actions/upload-artifact@v4
#        with:
#          name: screenshots-${{ matrix.label }}-${{ github.run_number }}
#          path: |
#            screenshots-attempt1/
#            screenshots/
#          retention-days: 7
#          if-no-files-found: ignore

      # ---------- 结果摘要 ----------
      - name: 写入 step summary
        if: always() && matrix.enabled == 'true'
        run: |
          {
            echo "## ${{ matrix.label }} 签到结果"
            echo ""
            if [ "${{ job.status }}" = "success" ]; then
              echo "- 状态：✅ 成功"
            else
              echo "- 状态：❌ 失败（\`${{ job.status }}\`）"
            fi
            echo "- 触发：\`${{ github.event_name }}\`"
            echo ""
            echo "📎 截图：本次运行的 Artifacts 中「screenshots-${{ matrix.label }}-${{ github.run_number }}」"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------- 清理 ----------
  cleanup:
    name: 清理历史运行记录
    runs-on: ubuntu-22.04
    needs: [sign]
    if: always()
    steps:
      - name: 清理历史运行记录
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 1
