name: 恩山论坛每日签到

on:
  schedule:
    # 每天北京时间 12:05 运行，对应 UTC 04:05
    - cron: '05 4 * * *'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  CHROME_VERSION: '131'

jobs:
  checkin:
    name: 执行签到
    runs-on: ubuntu-latest

    steps:
      - name: 拉取私有仓库
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: .

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装 Chrome 浏览器
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: ${{ env.CHROME_VERSION }}
          install-chromedriver: false

      - name: 安装中文字体
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-wqy-zenhei
          fc-cache -fv

      - name: 安装 Xvfb（虚拟显示）
        run: |
          sudo apt-get install -y xvfb

      - name: 启动 Xvfb
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp &
          sleep 2
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "启动 Xvfb 完成"

      - name: 安装 Python 依赖
        run: |
          pip install --upgrade pip
          pip install requests "requests[socks]" selenium undetected-chromedriver
          if [ -f Right/requirements.txt ]; then
            pip install -r Right/requirements.txt
          fi

      - name: 创建截图目录
        run: mkdir -p /tmp/screenshots

      - name: 清理 undetected-chromedriver 缓存
        run: |
          rm -rf "$HOME/.local/share/undetected_chromedriver" || true

      - name: 设置代理
        env:
          NODE_LINK: ${{ secrets.PROXY_NODE_360t7 }}  # 360t7 美国一年 - 双ISP - US
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          chmod +x scripts/setup_proxy.sh
          if ! bash scripts/setup_proxy.sh; then
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT_ID}" \
              -d parse_mode="HTML" \
              -d text="❌ <b>恩山签到失败</b>%0A%0A原因: 代理不可用%0A仓库: ${{ github.repository }}%0A查看: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --max-time 10 || true
            exit 1
          fi

      - name: 执行签到脚本
        env:
          RIGHT: ${{ secrets.RIGHT }}
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROME_VERSION: ${{ env.CHROME_VERSION }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DISPLAY: ':99'
        run: |
          python Right/main.py

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enshan-screenshots
          path: /tmp/screenshots/
          retention-days: 3
          if-no-files-found: ignore

      - name: 清理工作流记录（保留最近3次）
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 3

      - name: 清理代理与临时文件
        if: always()
        run: |
          pkill -f sing-box 2>/dev/null || true
          rm -f sing-box sing-box-config.json sing-box.log 2>/dev/null || true
